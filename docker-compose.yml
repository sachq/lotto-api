services:
  db:
    container_name: lotto_psql_db
    image: postgres:16.1
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: lotto_api
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: .
    container_name: lotto_mcp
    env_file:
      - .env
    environment:
      - POSTGRES_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.mcp.server"]
    stdin_open: true

volumes:
  pg_data:
